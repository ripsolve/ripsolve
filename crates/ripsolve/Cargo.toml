[package]
name = "ripsolve"
description = "A branch-and-cut solver for mixed-integer programs, in pure Rust. Fast on small and medium models."
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The integration tests read model files from the repository's samples directory,
# which sits outside this package. Shipping them would hand every consumer a
# `cargo test` that fails on missing paths, so they stay in the repository where
# they work. The unit tests inside src/ are published and run normally.
exclude = ["tests/**"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
lp_parser_rs.workspace = true
serde_json = "1"

[dependencies]
thiserror.workspace = true
lp_parser_rs.workspace = true
