[workspace]
resolver = "3"
members = ["crates/ripsolve", "crates/ripsolve-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ripsolve/ripsolve"

[workspace.dependencies]
ripsolve = { path = "crates/ripsolve", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
lp_parser_rs = "4.1"

[profile.release]
lto = true
codegen-units = 1
debug = 1

# The test suite solves real instances to proven optimality, which is thousands of
# simplex iterations. Unoptimized that takes minutes; optimized it takes seconds.
# `debug-assertions` stays on, so the debug_assert! invariants still run.
[profile.test]
opt-level = 2
